<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal-backdrop { backdrop-filter: blur(2px); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto bg-white rounded-lg shadow-md p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-6">用户管理系统</h1>

        <!-- 新增用户表单 -->
        <div class="mb-8 p-4 border border-gray-200 rounded-lg bg-gray-50">
            <h2 class="text-lg font-semibold text-gray-700 mb-4">新增用户</h2>
            <form id="addUserForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">用户名</label>
                    <input 
                        type="text" 
                        name="username" 
                        required
                        class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="请输入用户名"
                    >
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">邮箱</label>
                    <input 
                        type="email" 
                        name="email" 
                        required
                        class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="请输入邮箱"
                    >
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">年龄</label>
                    <input 
                        type="number" 
                        name="age" 
                        min="0" 
                        max="150"
                        class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="可选，0-150"
                    >
                </div>
                <button 
                    type="submit" 
                    class="md:col-span-3 w-full py-2 bg-blue-500 text-white rounded hover:bg-blue-600 transition-colors"
                >
                    新增用户
                </button>
            </form>
        </div>

        <!-- 用户列表 -->
        <div>
            <h2 class="text-lg font-semibold text-gray-700 mb-4">用户列表</h2>
            <div id="loading" class="text-center py-8 text-gray-500">加载中...</div>
            <div id="error" class="hidden text-center py-8 text-red-500"></div>
            <table id="userTable" class="hidden w-full border-collapse">
                <thead>
                    <tr class="bg-gray-100">
                        <th class="px-4 py-3 text-left text-sm font-medium text-gray-600 border-b">ID</th>
                        <th class="px-4 py-3 text-left text-sm font-medium text-gray-600 border-b">用户名</th>
                        <th class="px-4 py-3 text-left text-sm font-medium text-gray-600 border-b">邮箱</th>
                        <th class="px-4 py-3 text-left text-sm font-medium text-gray-600 border-b">年龄</th>
                        <th class="px-4 py-3 text-left text-sm font-medium text-gray-600 border-b">操作</th>
                    </tr>
                </thead>
                <tbody id="userList" class="divide-y divide-gray-200">
                    <!-- 动态生成用户数据 -->
                </tbody>
            </table>
            <div id="emptyTip" class="hidden text-center py-8 text-gray-500">暂无用户数据</div>
        </div>
    </div>

    <!-- 编辑用户弹窗 -->
    <div id="editModal" class="fixed inset-0 flex items-center justify-center z-50 hidden">
        <div class="absolute inset-0 bg-black/50 modal-backdrop" onclick="closeEditModal()"></div>
        <div class="relative bg-white rounded-lg shadow-xl p-6 w-full max-w-md mx-4 fade-in">
            <h3 class="text-xl font-bold text-gray-800 mb-4">编辑用户</h3>
            <form id="editUserForm">
                <input type="hidden" name="userId" id="editUserId">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-600 mb-1">用户名</label>
                    <input type="text" name="username" id="editUsername" required class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-600 mb-1">邮箱</label>
                    <input type="email" name="email" id="editEmail" required class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-600 mb-1">年龄</label>
                    <input type="number" name="age" id="editAge" min="0" max="150" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="flex gap-3">
                    <button type="button" onclick="closeEditModal()" class="flex-1 py-2 border border-gray-300 rounded hover:bg-gray-50 transition-colors">取消</button>
                    <button type="submit" class="flex-1 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 transition-colors">保存修改</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // API基础地址（与当前页面同域名端口）
        const API_BASE_URL = '/users';

        // DOM元素
        const addForm = document.getElementById('addUserForm');
        const editForm = document.getElementById('editUserForm');
        const editModal = document.getElementById('editModal');
        const userList = document.getElementById('userList');
        const [loading, error, userTable, emptyTip] = ['loading', 'error', 'userTable', 'emptyTip'].map(id => document.getElementById(id));
        const [editUserId, editUsername, editEmail, editAge] = ['editUserId', 'editUsername', 'editEmail', 'editAge'].map(id => document.getElementById(id));

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            fetchAllUsers();
            addForm.addEventListener('submit', handleAddUser);
            editForm.addEventListener('submit', handleEditUser);
        });

        // 1. 获取所有用户
        async function fetchAllUsers() {
            try {
                setLoadingState(true);
                const response = await fetch(API_BASE_URL);
                const result = await response.json();
                if (!response.ok) throw new Error(result.message || '获取失败');
                renderUserList(result.data || []);
            } catch (err) {
                setErrorState(`加载失败：${err.message}`);
            }
        }

        // 渲染用户列表
        function renderUserList(users) {
            setLoadingState(false);
            if (users.length === 0) return emptyTip.classList.remove('hidden');
            
            userTable.classList.remove('hidden');
            userList.innerHTML = users.map(user => `
                <tr class="hover:bg-gray-50 fade-in">
                    <td class="px-4 py-3 text-sm">${user.id}</td>
                    <td class="px-4 py-3 text-sm">${user.username}</td>
                    <td class="px-4 py-3 text-sm">${user.email}</td>
                    <td class="px-4 py-3 text-sm">${user.age || '-'}</td>
                    <td class="px-4 py-3 text-sm">
                        <button onclick="openEditModal(${user.id}, '${user.username}', '${user.email}', ${user.age || 'null'})" class="text-blue-500 hover:text-blue-700 mr-4">编辑</button>
                        <button onclick="deleteUser(${user.id})" class="text-red-500 hover:text-red-700">删除</button>
                    </td>
                </tr>
            `).join('');
        }

        // 2. 新增用户
        async function handleAddUser(e) {
            e.preventDefault();
            const userData = {
                username: addForm.username.value,
                email: addForm.email.value,
                age: addForm.age.value ? Number(addForm.age.value) : null
            };
            try {
                const response = await fetch(API_BASE_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.message || '新增失败');
                addForm.reset();
                fetchAllUsers();
                alert('新增成功！');
            } catch (err) {
                alert(`新增失败：${err.message}`);
            }
        }

        // 3. 编辑用户
        function openEditModal(id, username, email, age) {
            editUserId.value = id;
            editUsername.value = username;
            editEmail.value = email;
            editAge.value = age || '';
            editModal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeEditModal() {
            editModal.classList.add('hidden');
            document.body.style.overflow = '';
        }

        async function handleEditUser(e) {
            e.preventDefault();
            const userId = editUserId.value;
            const userData = {
                username: editUsername.value,
                email: editEmail.value,
                age: editAge.value ? Number(editAge.value) : null
            };
            try {
                const response = await fetch(`${API_BASE_URL}/${userId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.message || '修改失败');
                closeEditModal();
                fetchAllUsers();
                alert('修改成功！');
            } catch (err) {
                alert(`修改失败：${err.message}`);
            }
        }

        // 4. 删除用户
        async function deleteUser(userId) {
            if (!confirm(`确定删除ID为 ${userId} 的用户吗？`)) return;
            try {
                const response = await fetch(`${API_BASE_URL}/${userId}`, { method: 'DELETE' });
                const result = await response.json();
                if (!response.ok) throw new Error(result.message || '删除失败');
                fetchAllUsers();
                alert('删除成功！');
            } catch (err) {
                alert(`删除失败：${err.message}`);
            }
        }

        // 状态管理工具函数
        function setLoadingState(show) {
            [loading, error, userTable, emptyTip].forEach(el => el.classList.add('hidden'));
            if (show) loading.classList.remove('hidden');
        }

        function setErrorState(msg) {
            error.textContent = msg;
            error.classList.remove('hidden');
        }
    </script>
</body>
</html>
